# Proposed simulation assumptions, not empirical measurements.
# Sample with a dedicated NumPy Generator(PCG64(seed)); persist resolved versions.
schema_version = 1
seed = 42
n_shipments = 300
scheduled_start_utc = "2025-01-01T00:00:00Z"
departure_spacing_h = 12.0
route_assignment = "balanced_then_shuffled"

